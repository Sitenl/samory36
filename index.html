<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Samory 36 · Uma noite nos anos 30</title>
<meta name="description" content="Confirme sua presença no aniversário de 36 anos de Samory — 19 de dezembro, 17h.">
<meta property="og:title" content="Samory 36 · Uma noite nos anos 30">
<meta property="og:description" content="19 de dezembro de 2026, às 17h. Confirme sua presença.">
<meta name="theme-color" content="#0d0c0a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Limelight&family=Poiret+One&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0d0c0a; --ink-2:#17150f; --gold:#c9a24b; --gold-2:#e8cf8a; --gold-dim:#6e5a2c;
  --cream:#f1e7d0; --cream-dim:#b9ad93; --rose:#d98b74;
}
*{box-sizing:border-box;margin:0}
html{background:var(--ink)}
body{
  min-height:100dvh;color:var(--cream);font-family:"Cormorant Garamond",Georgia,serif;font-size:19px;line-height:1.5;
  background:
    radial-gradient(120% 60% at 50% 0%, #2a2414 0%, transparent 60%),
    repeating-conic-gradient(from 0deg at 50% -10%, rgba(201,162,75,.05) 0deg 3deg, transparent 3deg 9deg),
    var(--ink);
  padding:28px 16px 64px;
}
.card{
  max-width:560px;margin:0 auto;position:relative;padding:44px 28px 36px;
  border:1px solid var(--gold-dim);background:linear-gradient(180deg,rgba(23,21,15,.92),rgba(13,12,10,.96));
  outline:1px solid var(--gold-dim);outline-offset:6px;
}
.card::before,.card::after{
  content:"";position:absolute;width:44px;height:44px;border:2px solid var(--gold);
}
.card::before{top:-9px;left:-9px;border-right:0;border-bottom:0}
.card::after{bottom:-9px;right:-9px;border-left:0;border-top:0}
.fan{display:block;margin:0 auto 18px;width:120px;height:60px}
.kicker{font-family:"Poiret One",sans-serif;letter-spacing:.42em;text-transform:uppercase;text-align:center;color:var(--gold);font-size:13px}
h1{font-family:"Limelight",serif;font-weight:400;text-align:center;font-size:clamp(40px,11vw,62px);line-height:1;margin:14px 0 6px;
   background:linear-gradient(180deg,var(--gold-2),var(--gold) 55%,#8c6d2a);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{text-align:center;font-style:italic;color:var(--cream-dim);font-size:21px}
.rule{display:flex;align-items:center;gap:12px;margin:26px 0;color:var(--gold)}
.rule::before,.rule::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold-dim),transparent)}
.rule span{font-size:12px;letter-spacing:.3em}
.when{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;text-align:center;font-family:"Poiret One",sans-serif;text-transform:uppercase;letter-spacing:.18em}
.when .big{font-family:"Limelight",serif;font-size:58px;letter-spacing:0;color:var(--gold-2);line-height:1;padding:0 18px;border-left:1px solid var(--gold-dim);border-right:1px solid var(--gold-dim)}
.when small{display:block;font-size:13px;color:var(--cream-dim)}
.note{text-align:center;color:var(--cream-dim);font-size:17px;margin-top:18px}
form{margin-top:4px}
fieldset{border:0;padding:0;margin:0 0 22px}
legend,label.lbl{display:block;font-family:"Poiret One",sans-serif;letter-spacing:.2em;text-transform:uppercase;font-size:13px;color:var(--gold);margin-bottom:10px}
input[type=text],textarea{
  width:100%;background:transparent;border:0;border-bottom:1px solid var(--gold-dim);color:var(--cream);
  font:inherit;font-size:20px;padding:8px 2px;outline:none;border-radius:0
}
input[type=text]:focus,textarea:focus{border-bottom-color:var(--gold-2)}
textarea{resize:vertical;min-height:64px}
::placeholder{color:#7a705c;font-style:italic}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{position:relative}
.opt input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.opt span{
  display:flex;align-items:center;justify-content:center;min-height:52px;padding:8px 10px;text-align:center;
  border:1px solid var(--gold-dim);font-family:"Poiret One",sans-serif;letter-spacing:.08em;font-size:17px;color:var(--cream);
  transition:background .2s,border-color .2s,color .2s
}
.opt input:checked + span{background:var(--gold);border-color:var(--gold);color:var(--ink);font-weight:600}
.opt input:focus-visible + span{outline:2px solid var(--gold-2);outline-offset:2px}
.hidden{display:none}
.check{display:flex;gap:10px;align-items:center;margin:-6px 0 14px;font-size:18px;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--gold)}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
button{
  width:100%;margin-top:6px;padding:16px;border:1px solid var(--gold);background:linear-gradient(180deg,var(--gold-2),var(--gold));
  color:var(--ink);font-family:"Poiret One",sans-serif;font-weight:600;letter-spacing:.32em;text-transform:uppercase;font-size:16px;cursor:pointer
}
button:disabled{opacity:.6;cursor:wait}
.err{color:var(--rose);text-align:center;margin-top:12px;min-height:1.5em;font-size:17px}
.done{text-align:center}
.done h2{font-family:"Limelight",serif;font-weight:400;font-size:38px;color:var(--gold-2);margin:8px 0}
.done p{color:var(--cream-dim)}
.addr{margin:22px auto 0;padding:16px;border:1px solid var(--gold-dim);max-width:360px}
.addr strong{display:block;font-weight:600;color:var(--cream);font-size:20px}
.addr a{display:inline-block;margin-top:8px;color:var(--gold-2);font-family:"Poiret One",sans-serif;letter-spacing:.16em;text-transform:uppercase;font-size:13px}
.cal{margin:18px auto 0;max-width:360px}
.cal-t{font-family:"Poiret One",sans-serif;letter-spacing:.24em;text-transform:uppercase;font-size:12px;color:var(--gold);margin-bottom:10px}
.cal-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cal-row a{display:flex;align-items:center;justify-content:center;min-height:48px;padding:8px;border:1px solid var(--gold-dim);
  color:var(--cream);text-decoration:none;font-family:"Poiret One",sans-serif;letter-spacing:.06em;font-size:15px}
.cal-row a:hover,.cal-row a:focus-visible{border-color:var(--gold);color:var(--gold-2)}
.again{background:none;border:0;color:var(--gold);text-decoration:underline;margin-top:22px;width:auto;padding:4px;letter-spacing:.1em;font-size:14px}
footer{text-align:center;margin-top:30px;font-family:"Poiret One",sans-serif;letter-spacing:.3em;font-size:11px;color:var(--gold-dim);text-transform:uppercase}
@media (max-width:380px){.card{padding:38px 18px 30px}.when .big{font-size:48px;padding:0 12px}.opt span{font-size:15px}}
</style>
</head>
<body>
<main class="card">
  <svg class="fan" viewBox="0 0 120 60" aria-hidden="true">
    <g fill="none" stroke="#c9a24b" stroke-width="1.2">
      <path d="M10 58 A50 50 0 0 1 110 58"/><path d="M24 58 A36 36 0 0 1 96 58"/><path d="M38 58 A22 22 0 0 1 82 58"/>
      <path d="M60 58 L60 8"/><path d="M60 58 L25 22"/><path d="M60 58 L95 22"/><path d="M60 58 L12 44"/><path d="M60 58 L108 44"/>
    </g>
    <circle cx="60" cy="58" r="3" fill="#e8cf8a"/>
  </svg>

  <p class="kicker">Uma noite nos anos 30</p>
  <h1>Samory 36</h1>
  <p class="sub">Samory convida</p>

  <div class="rule"><span>◆</span></div>

  <div class="when">
    <div>Sábado<small>dezembro</small></div>
    <div class="big">19</div>
    <div>17h<small>2026</small></div>
  </div>
  <p class="note">Traje sugerido: anos 30. O endereço chega para você assim que confirmar.</p>

  <div class="rule"><span>RSVP</span></div>

  <section id="formArea">
    <form id="rsvp" novalidate>
      <fieldset>
        <label class="lbl" for="nome">Seu nome</label>
        <input type="text" id="nome" name="nome" autocomplete="name" placeholder="Como você é conhecido(a)" maxlength="80" required>
      </fieldset>

      <fieldset>
        <legend>Você vem?</legend>
        <div class="opts two">
          <label class="opt"><input type="radio" name="presenca" value="Sim" required><span>Com certeza</span></label>
          <label class="opt"><input type="radio" name="presenca" value="Não"><span>Não poderei</span></label>
        </div>
      </fieldset>

      <div id="sim" class="hidden">
        <fieldset>
          <legend>O que você vai beber?</legend>
          <div class="opts">
            <label class="opt"><input type="radio" name="bebida" value="Cerveja"><span>Cerveja</span></label>
            <label class="opt"><input type="radio" name="bebida" value="Vinho"><span>Vinho</span></label>
            <label class="opt"><input type="radio" name="bebida" value="Drinks"><span>Drinks</span></label>
            <label class="opt"><input type="radio" name="bebida" value="Sem álcool"><span>Sem álcool</span></label>
          </div>
        </fieldset>

        <label class="check"><input type="checkbox" id="temAcomp"> Vou com acompanhante</label>

        <div id="acompArea" class="hidden">
          <fieldset>
            <label class="lbl" for="acompanhante">Nome do acompanhante</label>
            <input type="text" id="acompanhante" name="acompanhante" maxlength="80" placeholder="Nome de quem vem com você">
          </fieldset>
          <fieldset>
            <legend>E o acompanhante bebe…</legend>
            <div class="opts">
              <label class="opt"><input type="radio" name="bebidaAcompanhante" value="Cerveja"><span>Cerveja</span></label>
              <label class="opt"><input type="radio" name="bebidaAcompanhante" value="Vinho"><span>Vinho</span></label>
              <label class="opt"><input type="radio" name="bebidaAcompanhante" value="Drinks"><span>Drinks</span></label>
              <label class="opt"><input type="radio" name="bebidaAcompanhante" value="Sem álcool"><span>Sem álcool</span></label>
            </div>
          </fieldset>
        </div>
      </div>

      <fieldset>
        <label class="lbl" for="recado">Um recado (opcional)</label>
        <textarea id="recado" name="recado" maxlength="500" placeholder="Deixe uma palavra para o aniversariante"></textarea>
      </fieldset>

      <div class="hp" aria-hidden="true"><input type="text" name="website" tabindex="-1" autocomplete="off"></div>

      <button type="submit" id="enviar">Enviar resposta</button>
      <p class="err" id="err" role="alert"></p>
    </form>
  </section>

  <section id="doneArea" class="done hidden" aria-live="polite"></section>

  <footer>MCMXXX · MMXXVI</footer>
</main>

<script>
const ENDPOINT = "https://script.google.com/macros/s/AKfycbx71VlWN7qhQ44IBb8wp70-zX5A1zqWAWG5ZrPUJKRS8osmBCyRaKU6SL9TEWQmgx-F5g/exec";
const f = document.getElementById("rsvp");
const sim = document.getElementById("sim");
const temAcomp = document.getElementById("temAcomp");
const acompArea = document.getElementById("acompArea");
const err = document.getElementById("err");
const btn = document.getElementById("enviar");

f.addEventListener("change", () => {
  const p = f.presenca.value;
  sim.classList.toggle("hidden", p !== "Sim");
  acompArea.classList.toggle("hidden", !(p === "Sim" && temAcomp.checked));
});

f.addEventListener("submit", async (ev) => {
  ev.preventDefault();
  err.textContent = "";
  const d = Object.fromEntries(new FormData(f).entries());
  d.nome = (d.nome || "").trim();
  if (!d.nome) return erro("Diga seu nome, por favor.");
  if (!d.presenca) return erro("Conte se você vem.");
  if (d.presenca === "Sim") {
    if (!d.bebida) return erro("Escolha sua bebida — é para a conta do bar.");
    if (temAcomp.checked) {
      if (!(d.acompanhante || "").trim()) return erro("Falta o nome do acompanhante.");
      if (!d.bebidaAcompanhante) return erro("Falta a bebida do acompanhante.");
    } else { d.acompanhante = ""; d.bebidaAcompanhante = ""; }
  } else { d.bebida = ""; d.acompanhante = ""; d.bebidaAcompanhante = ""; }

  btn.disabled = true; btn.textContent = "Enviando…";
  try {
    const r = await fetch(ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(d)
    });
    const res = await r.json();
    if (!res.ok) throw new Error(res.erro || "falha");
    mostra(d, res);
  } catch (e) {
    erro("Não consegui enviar agora. Tente de novo em instantes.");
  } finally {
    btn.disabled = false; btn.textContent = "Enviar resposta";
  }
});

function erro(m){ err.textContent = m; }

// Evento: 19/12/2026, 17h–23h em Salvador (UTC-3) = 20:00–02:00 UTC
const EVENTO = {
  titulo: "Samory 36 · Uma noite nos anos 30",
  inicio: "20261219T200000Z",
  fim: "20261220T020000Z",
  descricao: "Aniversário de 36 anos de Samory. Traje sugerido: anos 30.\nMudar resposta: " + location.href.split("?")[0]
};

function agenda(endereco){
  const local = (endereco || "").replace(" · ", ", ").replace(/Salvador$/, "Salvador - BA");
  const box = document.createElement("div"); box.className = "cal";
  const t = document.createElement("p"); t.className = "cal-t"; t.textContent = "Guarde na sua agenda";
  const g = document.createElement("a");
  g.href = "https://calendar.google.com/calendar/render?action=TEMPLATE" +
    "&text=" + encodeURIComponent(EVENTO.titulo) +
    "&dates=" + EVENTO.inicio + "/" + EVENTO.fim +
    "&ctz=America/Bahia" +
    "&location=" + encodeURIComponent(local) +
    "&details=" + encodeURIComponent(EVENTO.descricao);
  g.target = "_blank"; g.rel = "noopener"; g.textContent = "Google Agenda";
  const i = document.createElement("a");
  i.href = "#"; i.textContent = "iPhone / Outlook";
  i.onclick = (ev) => {
    ev.preventDefault();
    const esc = s => s.replace(/\\/g,"\\\\").replace(/[,;]/g, m => "\\" + m).replace(/\n/g,"\\n");
    const ics = [
      "BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//samory36//rsvp//PT","CALSCALE:GREGORIAN","METHOD:PUBLISH",
      "BEGIN:VEVENT",
      "UID:samory36-20261219@sitenl.github.io",
      "DTSTAMP:" + new Date().toISOString().replace(/[-:]/g,"").replace(/\.\d{3}/,""),
      "DTSTART:" + EVENTO.inicio, "DTEND:" + EVENTO.fim,
      "SUMMARY:" + esc(EVENTO.titulo),
      "LOCATION:" + esc(local),
      "DESCRIPTION:" + esc(EVENTO.descricao),
      "BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:" + esc(EVENTO.titulo),"TRIGGER:-P1D","END:VALARM",
      "END:VEVENT","END:VCALENDAR"
    ].join("\r\n");
    const url = URL.createObjectURL(new Blob([ics], { type: "text/calendar;charset=utf-8" }));
    const a = document.createElement("a"); a.href = url; a.download = "samory36.ics";
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  };
  const row = document.createElement("div"); row.className = "cal-row";
  row.append(g, i);
  box.append(t, row);
  return box;
}

function mostra(d, res){
  const done = document.getElementById("doneArea");
  done.replaceChildren();
  const h = document.createElement("h2");
  const p = document.createElement("p");
  const primeiro = d.nome.split(" ")[0];
  if (d.presenca === "Sim") {
    h.textContent = "Até lá, " + primeiro + "!";
    p.textContent = "Sua presença está confirmada. Separe o chapéu, as pérolas ou o suspensório.";
    done.append(h, p);
    if (res.endereco) {
      const a = document.createElement("div"); a.className = "addr";
      const s = document.createElement("strong"); s.textContent = res.endereco;
      const t = document.createElement("span"); t.textContent = "19 de dezembro · 17h";
      a.append(s, t);
      if (res.mapa) {
        const l = document.createElement("a"); l.href = res.mapa; l.target = "_blank"; l.rel = "noopener";
        l.textContent = "Abrir no mapa"; a.append(document.createElement("br"), l);
      }
      done.append(a);
      done.append(agenda(res.endereco));
    }
  } else {
    h.textContent = "Que pena, " + primeiro + ".";
    p.textContent = "Obrigado por avisar. Vamos brindar por você.";
    done.append(h, p);
  }
  const again = document.createElement("button");
  again.className = "again"; again.type = "button"; again.textContent = "Mudar minha resposta";
  again.onclick = () => { done.classList.add("hidden"); document.getElementById("formArea").classList.remove("hidden"); };
  done.append(again);
  document.getElementById("formArea").classList.add("hidden");
  done.classList.remove("hidden");
  window.scrollTo({ top: 0, behavior: "smooth" });
}
</script>
</body>
</html>
